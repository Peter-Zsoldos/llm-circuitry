[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "llm-circuitry"
version = "0.1.0"
description = "The missing hardware of LLM systems: prompt-injection memory protection, transactions with rollback, multi-agent cache coherence, interrupts and watchdogs, call stacks, claim verification, DMA handles, context paging, attestation and replay. Rust core, Python API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Peter-Zsoldos" }]
keywords = [
  "llm", "agents", "ai-agents", "multi-agent", "prompt-injection", "ai-safety",
  "llm-os", "agent-framework", "context-window", "hallucination", "rag", "mcp", "rust",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Peter-Zsoldos/llm-circuitry"
Repository = "https://github.com/Peter-Zsoldos/llm-circuitry"
Issues = "https://github.com/Peter-Zsoldos/llm-circuitry/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "llm_circuitry._core"
